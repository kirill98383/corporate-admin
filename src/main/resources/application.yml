spring:
  application:
    name: corporate-admin
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/corporate_admin}
    username: ${DB_USER:corporate_admin}
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: never
server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:true}
  error:
    include-message: never
    include-stacktrace: never
app:
  bootstrap:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}
---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:file:./data/admin;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
server:
  servlet:
    session:
      cookie:
        secure: false
