<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Журнал действий')}"></head><body><aside th:replace="~{fragments :: sidebar}"></aside><div class="shell"><header th:replace="~{fragments :: header('Журнал действий')}"></header><main><div class="eyebrow">ПРОЗРАЧНОСТЬ ИЗМЕНЕНИЙ</div><h1>Журнал действий</h1><p class="muted">Последние 200 изменений. Время указано со смещением часового пояса.</p><section class="panel table-wrap"><table><thead><tr><th>Время</th><th>Инициатор</th><th>Действие</th><th>Объект</th></tr></thead><tbody><tr th:each="e : ${events}"><td th:text="${#temporals.format(e.occurredAt, 'dd.MM.yyyy HH:mm:ss XXX')}"></td><td th:text="${e.actor}"></td><td><span class="tag" th:text="${e.action}"></span></td><td th:text="${e.target}"></td></tr></tbody></table></section></main></div></body></html>
