<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments :: head('Пользователи')}"></head><body><aside th:replace="~{fragments :: sidebar}"></aside><div class="shell"><header th:replace="~{fragments :: header('Пользователи')}"></header><main><div class="page-heading"><div><div class="eyebrow">УПРАВЛЕНИЕ КОМАНДОЙ</div><h1>Пользователи</h1><p class="muted">Учётные записи сотрудников и состояние доступа.</p></div><a class="button" th:href="@{/users/new}" sec:authorize="hasAuthority('USER_WRITE')">+ Добавить пользователя</a></div><section class="panel table-wrap"><table><thead><tr><th>Сотрудник</th><th>Логин</th><th>Доступ</th><th>Действия</th></tr></thead><tbody><tr th:each="u : ${users}"><td><strong th:text="${u.displayName}"></strong></td><td th:text="${u.username}"></td><td><span class="tag" th:classappend="${u.enabled ? 'green' : 'red'}" th:text="${u.enabled ? 'Активен' : 'Заблокирован'}"></span></td><td><a th:href="@{/users/{id}/edit(id=${u.id})}" sec:authorize="hasAuthority('USER_WRITE')">Настроить →</a><span sec:authorize="!hasAuthority('USER_WRITE')">Только просмотр</span></td></tr></tbody></table></section></main></div></body></html>
