<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Настройка роли')}"></head><body><aside th:replace="~{fragments :: sidebar}"></aside><div class="shell"><header th:replace="~{fragments :: header('Настройка роли')}"></header><main><div class="eyebrow">КОНТРОЛЬ ДОСТУПА</div><h1 th:text="${role == null ? 'Новая роль' : 'Настройка роли'}"></h1><p class="muted">Изменение прав применяется со следующего запроса пользователя.</p><form class="panel stack form-panel" th:action="${role == null} ? @{/roles} : @{/roles/{id}(id=${role.id})}" method="post"><label>Название<input name="name" th:value="${role?.name}" pattern="[A-Z][A-Z0-9_]{2,63}" maxlength="64" required placeholder="Например, SUPPORT"><small>3–64 символа: A-Z, 0-9 и подчёркивание, первый символ — буква</small></label><fieldset><legend>Разрешения</legend><label class="check permission-check" th:each="p : ${permissions}"><input type="checkbox" name="permissions" th:value="${p.name()}" th:checked="${role != null and role.permissions.contains(p)}"><span><strong th:text="${p.label}"></strong><small th:text="${p.name()}"></small></span></label></fieldset><p class="hint">USER_WRITE позволяет назначать любые роли, включая ADMIN. ROLE_WRITE позволяет расширять права настраиваемых ролей. Выдавайте эти права только доверенным администраторам.</p><div class="actions"><button type="submit">Сохранить роль</button><a th:href="@{/}">Отмена</a></div></form></main></div></body></html>
