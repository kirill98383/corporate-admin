<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments :: head('Роли и права')}"></head><body><aside th:replace="~{fragments :: sidebar}"></aside><div class="shell"><header th:replace="~{fragments :: header('Роли и права')}"></header><main><div class="page-heading"><div><div class="eyebrow">КОНТРОЛЬ ДОСТУПА</div><h1>Роли и права</h1><p class="muted">Права нескольких ролей складываются.</p></div><a class="button" th:href="@{/roles/new}" sec:authorize="hasAuthority('ROLE_WRITE')">+ Создать роль</a></div><div class="cards"><section class="card" th:each="r : ${roles}"><span class="badge" th:text="${r.systemRole ? 'Системная роль' : 'Настраиваемая роль'}"></span><h2 th:text="${r.name}"></h2><ul class="permission-list"><li th:each="p : ${r.permissions}" th:text="${p.label}"></li></ul><a th:if="${!r.systemRole}" th:href="@{/roles/{id}/edit(id=${r.id})}" sec:authorize="hasAuthority('ROLE_WRITE')">Настроить →</a></section></div></main></div></body></html>
