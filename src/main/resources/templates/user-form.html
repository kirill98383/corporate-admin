<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Настройка пользователя')}"></head><body><aside th:replace="~{fragments :: sidebar}"></aside><div class="shell"><header th:replace="~{fragments :: header('Учётная запись')}"></header><main><div class="eyebrow">ПОЛЬЗОВАТЕЛИ</div><h1 th:text="${account == null ? 'Новый пользователь' : account.username}"></h1><p class="muted">Управляйте профилем и назначенными ролями.</p>
<form class="panel stack form-panel" th:action="${account == null} ? @{/users} : @{/users/{id}(id=${account.id})}" method="post">
<label th:if="${account == null}">Логин<input name="username" pattern="[a-z0-9._-]{3,64}" minlength="3" maxlength="64" required><small>a-z, 0-9, точка, дефис и подчёркивание</small></label>
<label>Имя сотрудника<input name="displayName" th:value="${account?.displayName}" maxlength="100" required></label>
<label th:if="${account == null}">Начальный пароль<input name="password" type="password" minlength="12" maxlength="64" autocomplete="new-password" required><small>12–64 символа, не более 72 байт UTF-8</small></label>
<fieldset><legend>Роли</legend><label class="check" th:each="r : ${roles}"><input type="checkbox" name="roleIds" th:value="${r.id}" th:checked="${account != null and account.roleIds.contains(r.id)}"><span th:text="${r.name}"></span></label></fieldset>
<label class="check" th:if="${account != null}"><input type="checkbox" name="enabled" value="true" th:checked="${account.enabled}">Доступ активен</label><div class="actions"><button type="submit">Сохранить</button><a th:href="@{/}">Отмена</a></div></form>
<form th:if="${account != null}" class="panel stack form-panel" th:action="@{/users/{id}/password(id=${account.id})}" method="post"><h2>Сброс пароля</h2><p class="muted">Завершит существующие сессии при следующем запросе.</p><label>Новый пароль<input type="password" name="password" minlength="12" maxlength="64" autocomplete="new-password" required></label><button type="submit">Изменить пароль</button></form></main></div></body></html>
